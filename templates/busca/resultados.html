<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca - Arquivo Nostalgia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/resultados.css') }}">
</head>

<body>

    <header class="cabecalho-principal">
        <div class="logo-container">
            <img
            src="{{ url_for('static', filename='img/logo_arquivo_nostalgia.png') }}"
            alt="Logo"
            class="logo-pequena"
          />
            <span class="nome-site-header">ARQUIVO NOSTALGIA</span>
        </div>

        <div class="barra-busca">
            <input type="text" placeholder="Buscar Memórias:">
            <i class="fa-solid fa-magnifying-glass icone-busca"></i>
        </div>

        <nav class="menu-icones">
            <a href="#" class="item-menu">
                <i class="fa-solid fa-clapperboard"></i>
                <span>Filmes</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-tv"></i>
                <span>Séries</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-gamepad"></i>
                <span>Jogos</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-regular fa-folder-open"></i>
                <span>Arquivos</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-circle-user"></i>
                <span>Perfil</span>
            </a>
        </nav>
    </header>

    <main class="container-principal">
        
        <div class="area-conteudo-central">

            <div class="texto-resultado">
                <h2>Resultados para a busca: "Super Mario"</h2>
                <p>Rebobinamos a fita e achamos X títulos no nosso acervo.</p>
            </div>

            <div class="filtros-container">
                <button class="btn-filtro ativo">Todos</button>
                <button class="btn-filtro">Filmes</button>
                <button class="btn-filtro">Séries</button>
                <button class="btn-filtro">Jogos</button>
            </div>

            <div class="grade-posters">
                <div class="poster-vazio tipo-jogo"></div>
                <div class="poster-vazio tipo-filme"></div>
                <div class="poster-vazio tipo-jogo"></div>
                <div class="poster-vazio tipo-serie"></div>
                <div class="poster-vazio tipo-filme"></div>
                <div class="poster-vazio tipo-serie"></div>
                <div class="poster-vazio tipo-jogo"></div>
                <div class="poster-vazio tipo-filme"></div>
                <div class="poster-vazio tipo-filme"></div>
                <div class="poster-vazio tipo-serie"></div>
                <div class="poster-vazio tipo-jogo"></div>
                <div class="poster-vazio tipo-serie"></div>
                <div class="poster-vazio tipo-filme"></div>
                <div class="poster-vazio tipo-jogo"></div>
                <div class="poster-vazio tipo-serie"></div>
                <div class="poster-vazio tipo-filme"></div>
            </div>

            <div class="container-botao-mais">
                <button id="botao-ver-mais">Ver Mais</button>
            </div>
        </div>

    </main>

    <footer class="rodape-principal">
        <div class="links-rodape">
            <a href="#">Termos de Uso</a>
            <span class="separador">|</span>
            <a href="#">Política de Privacidade</a>
        </div>
        <div class="texto-copyright">
            Arquivo Nostalgia &copy; 2025. Feito para quem não esquece de onde veio.
        </div>
    </footer>

    <!-- Script específico da página de busca -->
    <script src="{{ url_for('static', filename='js/resultados.js') }}"></script>

</body>
</html>
